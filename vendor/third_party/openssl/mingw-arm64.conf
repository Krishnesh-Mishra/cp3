# Custom OpenSSL target: Windows on ARM64 (aarch64-w64-mingw32), no-asm.
#
# OpenSSL 3.5.5 has no mingw-w64 aarch64 target (mingw64 is x86_64-only and the
# VC-* arm64 targets are MSVC/ucrt-specific). This file is loaded by Configure
# through the OPENSSL_LOCAL_CONFIG_DIR environment variable (see Configure,
# "Collect target configurations": every *.conf in that directory is read).
#
#   OPENSSL_LOCAL_CONFIG_DIR=<repo>/vendor/third_party/openssl  perl Configure mingw-arm64 ...
#
# Deliberately no asm_arch: a pure C build. It is fully portable across the
# aarch64 Windows ABIs and needs no perlasm/arm-xlate integration; the arm64
# lane can graduate to WITH asm once the archive is verified on real hardware.
#
# inherits mingw-common: L_ENDIAN (aarch64 is little-endian), ex_libs
# (-lws2_32 -lgdi32 -lcrypt32), winthreads, win32 dso_scheme, win32/mingw perl
# platform. Environment CC/CXX/AR/RANLIB override the gcc default.

my %targets = (
    "mingw-arm64" => {
        inherit_from     => [ "mingw-common" ],
    },
);
